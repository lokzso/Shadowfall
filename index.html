<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07100b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Shadowfall: Warborn</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="boot">
  <div class="logo">SHADOWFALL<br><span>WARBORN</span></div>
  <div id="status">Запуск игры…</div>
  <div class="bar"><i id="progress"></i></div>
  <div id="err"></div>
</div>
<canvas id="game"></canvas>
<div id="hud"></div><div id="quest"></div><div id="panel"></div>
<div id="mobile">
  <div id="joy"><div id="knob"></div></div>
  <div class="skills">
    <button data-skill="Q">Q</button><button data-skill="W">W</button>
    <button data-skill="E">E</button><button data-skill="R" class="ult">R</button>
  </div>
  <div class="actions"><button data-act="F">F</button><button data-act="I">I</button><button data-act="B">B</button></div>
</div>
<div id="picker"><div class="card"><h1>Выбери героя</h1><div id="heroes"></div><small>Во время игры прогресс автоматически сохраняется на этом устройстве.</small></div></div>
<script src="game.js"></script>
</body></html>
